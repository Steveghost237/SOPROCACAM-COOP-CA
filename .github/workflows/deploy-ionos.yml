name: Déploiement automatique → IONOS (www.soprocacam.com)

# Déclenché à chaque push sur la branche main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Déploiement SFTP vers IONOS
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Déployer via SFTP sur l'hébergement IONOS
      #    Protocole : SFTP (SSH) — Port 22
      #    Serveur   : access-5021759308.webspace-host.com
      #    Username  : su1966859
      - name: Déploiement SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_SERVER }}
          username:    ${{ secrets.SFTP_USERNAME }}
          password:    ${{ secrets.SFTP_PASSWORD }}
          port:        '22'
          local_path:  './*'
          remote_path: ${{ secrets.SFTP_REMOTE_DIR }}
          sftp_only:   true
          args:        '-o ConnectTimeout=10 -o StrictHostKeyChecking=no'
